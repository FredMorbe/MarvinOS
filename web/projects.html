<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macii — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/theme-boot.js"></script>
<link rel="stylesheet" href="/hud.css">
<link rel="stylesheet" href="/theme.css">
<style>
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); max-width: 1500px; width: 100%; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: var(--sp-4); padding: var(--sp-2) var(--sp-4) var(--sp-4); align-content: start; align-items: start; }
  .card { border: 1px solid var(--line); background: var(--shade-1); padding: var(--sp-4); display: grid; gap: var(--sp-3); min-width: 0; }
  .card.ask { border-color: rgba(var(--r-rgb), .6); }
  .card h2 { font: 700 20px/1.2 var(--f-head); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .path { font: 400 var(--fs-1)/1.4 var(--f-mono); color: var(--sec); letter-spacing: .04em; overflow-wrap: anywhere; }
  .stats { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .nums { display: flex; gap: var(--sp-5); font: 400 var(--fs-1)/1.4 var(--f-mono); color: var(--sec); letter-spacing: .08em; text-transform: uppercase; }
  .nums b { display: block; font: 500 var(--fs-4)/1.2 var(--f-mono); color: var(--txt); font-variant-numeric: tabular-nums; }
  .ag { display: flex; align-items: center; gap: var(--sp-3); font: 400 12px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--txt); min-width: 0; }
  .ag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag em { margin-left: auto; font-style: normal; color: var(--sec); flex: none; }
  .agents { display: grid; gap: var(--sp-2); }
  .addbar { display: flex; gap: var(--sp-3); padding: 0 var(--sp-4) var(--sp-3); }
  .addbar .input { flex: 1; min-width: 0; }
  .links { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <main class="main">
    <section class="panel">
      <div class="panel-h"><span class="eyebrow">Projects</span><span class="meta" id="meta"></span><button class="btn" id="add" type="button">Add folder</button></div>
      <form id="add-form" class="addbar" hidden><input class="input" id="add-path" aria-label="Folder path" placeholder="D:\Workspace\my-project" autocomplete="off"><button class="btn" type="button" id="browse">Browse…</button><button class="btn solid" type="submit">Add</button></form>
      <div class="panel-b" style="padding:0"><div class="grid" id="grid"></div></div>
    </section>
  </main>
</div>
<script type="module">
import { state, subscribe, api, act, browseFolder, mountShell, projectsOf, agentState, chooseGraph, esc, ago, tok } from '/app.js';
mountShell('projects');
const LABEL = { running: 'running', waiting: 'asks you', approval: 'needs approval', idle: 'idle' };

function card(p, s) {
  const chips = [
    p.asking ? `<span class="chip red">${p.asking} waiting for you</span>` : '',
    p.warnings ? `<span class="chip orange">${p.warnings} warning${p.warnings > 1 ? 's' : ''}</span>` : '',
    p.failed ? `<span class="chip red">${p.failed} failed (24h)</span>` : '',
    p.queued ? `<span class="chip">${p.queued} queued</span>` : '',
    p.tasksOpen ? `<a class="chip cyan" href="/tasks.html#${encodeURIComponent(p.key)}">${p.tasksOpen} open task${p.tasksOpen > 1 ? 's' : ''}</a>` : '',
  ].join('');
  const empty = p.agents.length ? '' : '<div class="path">No agents work here yet.</div>';
  const sameFolder = p.agents.length > 1 ? '<div class="path">These agents share this folder: they run one after another, never at the same time.</div>' : '';
  return `<article class="card ${p.asking ? 'ask' : ''}">
    <div><h2>${esc(p.name)}</h2><div class="path">${esc(p.path)}</div></div>
    <div class="stats">${chips || '<span class="chip cyan">all quiet</span>'}</div>
    <div class="nums"><div><b>${p.running}</b>running</div><div><b>${p.agents.length}</b>agents</div><div><b>${tok(p.tokens)}</b>tokens 24h</div><div><b>${p.last ? ago(p.last) : '–'}</b>last activity</div></div>
    <div class="agents">${p.agents.map(a => { const st = agentState(a, s); return `<div class="ag"><i class="dot ${st === 'running' ? 'running' : st === 'approval' ? 'approval' : st === 'waiting' ? 'waiting' : ''}"></i><span>${esc(a.name)}</span><em>${LABEL[st]}</em></div>`; }).join('')}</div>
    ${empty}${sameFolder}
    <div class="links"><a class="btn" href="/agents.html?cwd=${encodeURIComponent(p.path)}">New agent here</a><a class="btn" href="/inbox.html">Inbox</a><a class="btn" href="/memory.html" data-graph="${esc(p.graphId ?? '')}">Memory</a>${p.agents.length || !p.graphId ? '' : `<button class="btn red" type="button" data-remove="${esc(p.graphId)}" data-name="${esc(p.name)}">Remove</button>`}</div>
  </article>`;
}

subscribe(s => {
  if (!s.loaded) return;
  const ps = projectsOf(s);
  $('meta').textContent = `${ps.length} PROJECT${ps.length === 1 ? '' : 'S'} · ${ps.reduce((n, p) => n + p.running, 0)} RUNNING`;
  $('grid').innerHTML = ps.length ? ps.map(p => card(p, s)).join('') : '<div class="empty">No projects yet. A project appears as soon as an agent works in a folder.</div>';
});
function $(id) { return document.getElementById(id); }

$('add').onclick = () => { $('add-form').hidden = !$('add-form').hidden; if (!$('add-form').hidden) $('add-path').focus(); };
$('browse').onclick = async () => { const p = await browseFolder($('add-path').value.trim()); if (p) { $('add-path').value = p; $('add-path').focus(); } };
$('add-form').onsubmit = e => {
  e.preventDefault();
  act(async () => { await api('POST', '/api/graphs', { path: $('add-path').value }); $('add-path').value = ''; $('add-form').hidden = true; });
};
$('grid').onclick = e => {
  const m = e.target.closest('[data-graph]'), rm = e.target.closest('[data-remove]');
  if (m && m.dataset.graph) chooseGraph(m.dataset.graph); // the Memory page opens on this project
  if (rm && confirm(`Remove "${rm.dataset.name}" from the project list? Its memory graph is deleted too (rebuildable); the folder itself is not touched.`)) act(() => api('DELETE', `/api/graphs/${encodeURIComponent(rm.dataset.remove)}`));
};
</script>
</body>
</html>
